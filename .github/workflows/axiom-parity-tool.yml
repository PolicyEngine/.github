name: axiom-parity tool

on:
  pull_request:
    paths:
      - axiom-parity/**
      - .github/workflows/axiom-parity*.yml
  push:
    branches: [main]
    paths:
      - axiom-parity/**

jobs:
  test:
    name: Lint and test axiom-parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: axiom-parity
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Check formatting
        run: uvx ruff format --check .
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run --group dev pytest
